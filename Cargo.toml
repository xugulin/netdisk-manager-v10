[workspace]
resolver = "2"
members = [
    "crates/wp-core",
    "crates/wp-net",
    "crates/wp-drive",
    "crates/wp-drive-baidu",
    "crates/wp-drive-quark",
    "crates/wp-drive-guangya",
    "crates/wp-transfer",
    "crates/wp-media",
    "crates/wp-media-mpv",
    "crates/wp-stream",
    "crates/wp-subtitle",
    "crates/wp-danmaku",
    "crates/wp-ai",
    "crates/wp-gui",
    "crates/wp-cli",
]
default-members = ["crates/wp-gui", "crates/wp-cli"]

[workspace.package]
version = "1.0.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
authors = ["xgl"]

[workspace.dependencies]
wp-core = { path = "crates/wp-core" }
wp-net = { path = "crates/wp-net" }
wp-drive = { path = "crates/wp-drive" }
wp-drive-baidu = { path = "crates/wp-drive-baidu" }
wp-drive-quark = { path = "crates/wp-drive-quark" }
wp-drive-guangya = { path = "crates/wp-drive-guangya" }
wp-transfer = { path = "crates/wp-transfer" }
wp-media = { path = "crates/wp-media" }
wp-media-mpv = { path = "crates/wp-media-mpv" }
wp-stream = { path = "crates/wp-stream" }
wp-subtitle = { path = "crates/wp-subtitle" }
wp-danmaku = { path = "crates/wp-danmaku" }
wp-ai = { path = "crates/wp-ai" }

libloading = "0.9"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util", "net"] }
reqwest = { version = "0.12", default-features = false, features = [
    "json", "rustls-tls", "cookies", "stream", "gzip", "brotli", "deflate", "charset", "http2",
] }
async-trait = "0.1"
futures-util = "0.3"
url = "2"
percent-encoding = "2"
base64 = "0.22"
md-5 = "0.10"
sha1 = "0.10"
sha2 = "0.10"
hmac = "0.12"
rand = "0.8"
uuid = { version = "1", features = ["v4"] }
dirs = "6"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
qrcode = { version = "0.14", default-features = false, features = ["image"] }
egui = "0.37"
eframe = "0.37"
rfd = "0.15"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

# 调试构建也优化依赖，否则 egui 首帧很慢
[profile.dev.package."*"]
opt-level = 1

[profile.dev]
opt-level = 0

# 本地补丁：`vendor/glutin-winit` 仅修改 Windows 的 EGL 优先级（ANGLE 优先），
# 让 eframe/glow 在 Windows 上优先用 ANGLE 创建 GLES 上下文（libmpv render API 硬解互操作需要）。
# 详见 docs/PLAYER_WINDOWS_ANGLE.md；Linux 行为不变。
[patch.crates-io]
glutin-winit = { path = "vendor/glutin-winit" }
