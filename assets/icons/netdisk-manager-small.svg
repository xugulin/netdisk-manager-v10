<?xml version="1.0" encoding="UTF-8"?>
<!-- 网盘管理小尺寸图标（16~32px）：去掉轨道/星屑，放大云朵与箭头保证可辨识 -->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3D5AFE"/>
      <stop offset="0.5" stop-color="#6C4DF6"/>
      <stop offset="1" stop-color="#A64BF0"/>
    </linearGradient>
    <linearGradient id="cloud" x1="0.2" y1="0" x2="0.75" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E2EAFF"/>
    </linearGradient>
    <mask id="m">
      <rect width="512" height="512" fill="#000"/>
      <path fill="#fff" d="M 96 322 C 96 268 132 228 184 220
        C 194 170 238 132 290 132 C 348 132 394 174 402 226
        C 432 238 452 268 452 300
        C 452 336 424 362 386 362
        L 162 362 C 124 362 96 346 96 322 Z"/>
      <path fill="#000" d="M 272 168 L 320 236 L 294 236
        L 294 310 Q 294 320 284 320
        L 260 320 Q 250 320 250 310
        L 250 236 L 224 236 Z"/>
    </mask>
  </defs>
  <rect width="512" height="512" rx="118" fill="url(#bg)"/>
  <g mask="url(#m)">
    <rect width="512" height="512" fill="url(#cloud)"/>
  </g>
</svg>
